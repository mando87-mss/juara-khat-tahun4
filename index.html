.btn{display:block;width:100%;border:0;border-radius:22px;padding:7px 16px;margin:8px 0;font:inherit;font-weight:700;color:#fff;background:var(--pri);box-shadow:0 5px 0 rgba(0,0,0,.18);cursor:pointer;text-align:center}

.card{background:var(--card);border-radius:24px;padding:14px;box-shadow:0 3px 12px rgba(14,100,110,.18);margin:10px 0}
.top{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:700}
.bar{height:14px;border-radius:9px;background:rgba(127,127,127,.25);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:100%;background:var(--ok);border-radius:9px;transition:width .25s linear,background .3s}
.pic{width:110px;height:110px;border-radius:50%;margin:4px auto;display:flex;align-items:center;justify-content:center;font-size:50px;letter-spacing:-6px;background:radial-gradient(circle,#e3fafc,#99e9f2);box-shadow:inset 0 0 0 5px #fff9,0 0 0 4px #66d9e8}
.q{text-align:center;font-weight:700;font-size:23px;line-height:2}.fb{text-align:center;font-weight:700;min-height:34px;font-size:22px}
.opt{display:block;width:100%;text-align:center;border:3px solid transparent;background:var(--card);color:var(--ink);border-radius:18px;padding:5px 14px;margin:8px 0;font:inherit;font-size:22px;box-shadow:0 2px 8px rgba(14,100,110,.16);cursor:pointer}
.opt.ok{background:#c9f5e4;border-color:var(--ok);color:#064}.opt.no{background:#ffd9da;border-color:var(--bad);color:#800}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mc{min-height:62px;border:3px solid transparent;border-radius:16px;font:inherit;font-weight:700;font-size:20px;line-height:1.6;background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(14,100,110,.18);padding:4px 8px;cursor:pointer}
.mc.up{border-color:#3b82f6;background:#dbeafe;color:#123}.mc.done{background:#c9f5e4;color:#064;opacity:.55;box-shadow:none}.mc.sk{animation:sk .35s;border-color:var(--bad)}
@keyframes sk{25%{transform:translateX(7px)}75%{transform:translateX(-7px)}}
.stars{font-size:48px;text-align:center}.big{font-size:42px;text-align:center;font-weight:700}
.tools{display:flex;gap:8px;justify-content:center}.tools button{border:0;border-radius:12px;padding:4px 12px;font:inherit;background:var(--card);color:var(--ink);cursor:pointer}
.note{font-size:14px;color:var(--mut);text-align:center;margin-top:14px}
.tf{display:flex;gap:10px}.tf .btn{margin:6px 0}
.built{min-height:70px;border:3px dashed var(--pri);border-radius:18px;text-align:center;font-size:34px;font-weight:700;line-height:2;padding:4px 10px;margin:8px 0;color:var(--pri)}.built.sk{animation:sk .35s;border-color:var(--bad)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.tile{border:0;border-radius:14px;padding:2px 16px;font:inherit;font-size:28px;font-weight:700;background:#ffe066;color:#3a2a00;box-shadow:0 3px 0 rgba(0,0,0,.2);cursor:pointer}.tile:disabled{opacity:.25}
.word{text-align:center;font-size:40px;font-weight:700;color:var(--pri);line-height:2}
.cl{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.cl .btn{margin:4px 0;font-size:20px}
.cvw{position:relative;width:100%;max-width:340px;aspect-ratio:300/240;margin:8px auto;border:3px solid var(--pri);border-radius:18px;background:#fff;overflow:hidden;touch-action:none}
.cvw canvas{position:absolute;inset:0;width:100%;height:100%}
.pop{animation:p .35s}@keyframes p{50%{transform:scale(1.12)}}
</style>

function nT(){clearInterval(T);if(ti>=ts.length){var s=tsc>=ts.length*.85?3:tsc>=ts.length*.5?2:1;return end('🎉 هيبت!',s,'<div class="big">'+n(tsc)+'/'+n(ts.length)+'</div>','<button class="btn g" onclick="startT()">✅ مين لاڬي</button>')}
tl=12;ans=false;app.innerHTML='<div class="top"><span>'+n(ti+1)+'/'+n(ts.length)+'</span><span id="tt">'+n(12)+'</span><span>⭐ '+n(tsc)+'</span></div><div class="bar"><i id="tb"></i></div><div class="card"><div class="pic pop">🤔</div><div class="q" dir="auto">'+ts[ti][0]+'</div></div><div class="fb" id="fb"></div><div class="tf"><button class="btn g" onclick="tfp(1)">✅ بتول</button><button class="btn" style="background:var(--bad)" onclick="tfp(0)">❌ سله</button></div>'+tools();timer(12,function(){tfp(-1)})}
function tfp(v){if(ans)return;ans=true;clearInterval(T);var ok=v===ts[ti][1];if(ok){tsc++;sfx('ok')}else sfx('no');$('#fb').textContent=ok?'ماشاء الله! 🌟':'جاواڤن: '+(ts[ti][1]?'بتول':'سله');ti++;setTimeout(nT,1400)}
// ===== Sambungkan pasangan =====
var cs,sel,mv,left;
function startM(){ac();var p=sh(P.filter(function(x){return !bab||x[2]===bab})).slice(0,6),c=[];p.forEach(function(x,i){c.push([x[0],i,0],[x[1],i,0])});cs=sh(c);sel=-1;mv=0;left=p.length;tl=60;music();dm();timer(60,function(){endM(false)})}
function dm(sk){app.innerHTML='<div class="top"><span>🔗 سمبوڠكن</span><span id="tt">'+n(tl)+'</span><span>لڠكه: '+n(mv)+'</span></div><div class="bar"><i id="tb" style="width:'+(tl/60*100)+'%"></i></div><p class="sub">تكن دوا كد يڠ برڤاسڠن</p><div class="grid">'+
cs.map(function(c,i){return '<button class="mc'+(c[2]?' done':i===sel?' up':'')+(sk&&sk.indexOf(i)>-1?' sk':'')+'" dir="auto" onclick="tp('+i+')">'+c[0]+'</button>'}).join('')+'</div>'+tools()}
function tp(i){if(cs[i][2]||i===sel)return;if(sel<0){sel=i;return dm()}var a=cs[sel],b=cs[i],j=sel;mv++;sel=-1;
if(a[1]===b[1]){a[2]=b[2]=1;left--;sfx('ok');dm();if(!left){clearInterval(T);endM(true)}}else{sfx('no');dm([j,i])}}
function endM(w){clearInterval(T);var s=w?(mv<=left+8?3:mv<=16?2:1):0;end(w?'🎉 هيبت!':'⏰ ماس تامت',s,'<div class="big">'+n(mv)+' لڠكه</div>','<button class="btn b" onclick="startM()">🔗 چوبا لاڬي</button>')}
// ===== Tulis khat (jejak huruf) =====
var kq,ki,ksc,kd,kl,kcx,kmask,KW=300,KH2=240,KF='bold 190px "Noto Naskh Arabic","Traditional Arabic",serif';
function startK(){ac();kq=sh(KH).slice(0,5);ki=0;ksc=0;nK()}
function nK(){clearInterval(T);if(ki>=kq.length){var avg=ksc/kq.length,s=avg>=.55?3:avg>=.35?2:1;return end('🎉 هيبت!',s,'<div class="big">'+n(Math.round(avg*100))+'٪</div><div class="sub">ڤراتوس كتڤتن ڤنولسن</div>','<button class="btn" style="background:#5f3dc4" onclick="startK()">🖋️ مين لاڬي</button>')}
kl=kq[ki];app.innerHTML='<div class="top"><span>'+n(ki+1)+'/'+n(kq.length)+'</span><span>خط نسخ</span></div><div class="card"><p class="sub">ايكوتي حروف «'+kl+'» ايني دڠن جاري</p><div class="cvw"><canvas id="cg" width="'+KW+'" height="'+KH2+'"></canvas><canvas id="cu" width="'+KW+'" height="'+KH2+'"></canvas></div></div><div class="fb" id="fb"></div><div class="grid"><button class="btn s" onclick="kclr()">🧹 ڤادم</button><button class="btn g" onclick="kdone()">✔️ سيمق</button></div>'+tools();
var f=function(){kdraw()};try{document.fonts.load(KF,kl).then(f,f)}catch(e){f()}}
function kdraw(){var g=$('#cg').getContext('2d');g.clearRect(0,0,KW,KH2);g.font=KF;g.textAlign='center';g.textBaseline='middle';g.fillStyle='rgba(14,143,156,.28)';g.fillText(kl,KW/2,KH2/2+8);
var mk=document.createElement('canvas');mk.width=KW;mk.height=KH2;var m=mk.getContext('2d');m.font=KF;m.textAlign='center';m.textBaseline='middle';m.fillStyle='#000';m.fillText(kl,KW/2,KH2/2+8);kmask=m.getImageData(0,0,KW,KH2).data;
var u=$('#cu'),x=u.getContext('2d');kcx=x;x.lineWidth=16;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#5f3dc4';kd=false;
function pt(e){var r=u.getBoundingClientRect();return[(e.clientX-r.left)*KW/r.width,(e.clientY-r.top)*KH2/r.height]}
u.onpointerdown=function(e){kd=true;var p=pt(e);x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[0]+.1,p[1]+.1);x.stroke();u.setPointerCapture(e.pointerId)};
u.onpointermove=function(e){if(!kd)return;var p=pt(e);x.lineTo(p[0],p[1]);x.stroke()};
u.onpointerup=u.onpointercancel=function(){kd=false}}
function kclr(){kcx.clearRect(0,0,KW,KH2)}
function kdone(){var d=kcx.getImageData(0,0,KW,KH2).data,tot=0,cov=0,us=0,out=0;
for(var i=3;i<d.length;i+=4){var mk=kmask[i]>60,uu=d[i]>60;if(mk)tot++;if(uu)us++;if(mk&&uu)cov++;if(uu&&!mk)out++}
var c=tot?cov/tot:0,o=us?out/us:1,s=Math.max(0,Math.min(1,c-.5*o));ksc+=s;sfx(s>=.35?'ok':'no');
$('#fb').textContent='كتڤتن: '+n(Math.round(s*100))+'٪ '+(s>=.55?'⭐⭐⭐ ماشاء الله!':s>=.35?'⭐⭐ باءيق!':'⭐ چوبا لاڬي!');ki++;setTimeout(nK,1800)}
home();
</script>
</body>
